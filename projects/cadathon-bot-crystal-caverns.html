<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CADathon bot - Crystal Caverns - Arnan Srivastava</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style.css?v=3">
</head>
<body>
<div class="site-frame detail-frame">
  <a class="back-link" href="../index.html">&larr; Back to portfolio</a>
  <div class="compare-slider" id="cc-slider">
    <img class="compare-image compare-base" src="../images/cadathon-bot-crystal-caverns-block.png" alt="block CAD">
    <img class="compare-image compare-overlay-img" id="cc-overlay-img" src="../images/cadathon-bot-crystal-caverns-full.png" alt="full-detail CAD">
    <div class="compare-line" id="cc-line"></div>
    <input type="range" class="compare-range" id="cc-range" min="0" max="100" value="50" aria-label="Reveal high-detail CAD">
  </div>
  <p class="desc" style="margin-top:10px; font-size:15px;">Drag left/right - block CAD on the left, the high-detail CAD it became on the right.</p>

  <h1>CADathon bot - Crystal Caverns</h1>
  <p class="desc detail-desc">[Replace: description of the CADathon submission for Crystal Caverns - the constraint, the design response.]</p>
</div>
<script>
  (function () {
    var overlayImg = document.getElementById('cc-overlay-img');
    var line = document.getElementById('cc-line');
    var range = document.getElementById('cc-range');

    function update() {
      var pct = Number(range.value);
      overlayImg.style.clipPath = 'polygon(0 0, ' + pct + '% 0, ' + pct + '% 100%, 0 100%)';
      line.style.left = pct + '%';
    }

    range.addEventListener('input', update);
    update();
  })();
</script>
</body>
</html>
