<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- EDIT: page title shown in the browser tab -->
<title>Robotics awards - Arnan Srivastava</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style.css?v=7">
</head>
<body>
<img class="detail-bg" src="../images/bg-eclipse.jpg" alt="">
<div class="site-frame detail-frame">
  <a class="back-link" href="../3d-prints.html">&larr; Back to 3D prints</a>
  <!-- EDIT: image shown for this project. Change the src filename to swap the picture (put the matching file in /images). alt text is the fallback label shown if the image is missing. -->
  <!-- EDIT: project title -->
  <h1>Robotics awards</h1>
  <!-- EDIT: project description. Replace the [Replace: ...] placeholder text with the real writeup. -->
  <p class="desc detail-desc">Designed and printed to present to kids on the team. [Replace: further detail on the design and the occasion.]</p>

  <!-- EDIT: image gallery. To reuse this pattern on another page, copy this whole block
       plus the script tag below it, then change: the id="..." values (must be unique per
       page if a page ever has two galleries), and the images array in the script to your
       own list of filenames from /images. Each image can have a caption - leave caption
       as '' for no caption (default), or put text in quotes to show one under the image. -->
  <h2 class="detail-subhead">Gallery</h2>
  <div class="gallery photo-gallery" id="robotics_awards-gallery">
    <img id="robotics_awards-gallery-img" src="../images/robotics-awards-gallery-1.jpg" alt="robotics-awards gallery image">
    <button class="gallery-btn prev" id="robotics_awards-gallery-prev" aria-label="Previous image">&larr;</button>
    <button class="gallery-btn next" id="robotics_awards-gallery-next" aria-label="Next image">&rarr;</button>
  </div>
  <p class="gallery-counter" id="robotics_awards-gallery-counter">1 / 4</p>
  <p class="gallery-caption" id="robotics_awards-gallery-caption"></p>
  <p class="detail-credit">Credit &amp; Copyright: Reinhold Wittich</p>
</div>

<script>
  (function () {
    var images = [
      { src: 'robotics-awards.png', caption: '' },
      { src: 'robotics-awards-gallery-1.jpg', caption: '' },
      { src: 'robotics-awards-gallery-2.jpg', caption: '' },
      { src: 'robotics-awards-gallery-3.jpg', caption: '' },
      { src: 'robotics-awards-gallery-4.jpg', caption: '' }
    ];
    var index = 0;
    var img = document.getElementById('robotics_awards-gallery-img');
    var counter = document.getElementById('robotics_awards-gallery-counter');
    var caption = document.getElementById('robotics_awards-gallery-caption');
    var prevBtn = document.getElementById('robotics_awards-gallery-prev');
    var nextBtn = document.getElementById('robotics_awards-gallery-next');

    function update() {
      img.src = '../images/' + images[index].src;
      counter.textContent = (index + 1) + ' / ' + images.length;
      if (images[index].caption) {
        caption.textContent = images[index].caption;
        caption.style.display = 'block';
      } else {
        caption.textContent = '';
        caption.style.display = 'none';
      }
    }

    prevBtn.addEventListener('click', function () {
      index = (index - 1 + images.length) % images.length;
      update();
    });
    nextBtn.addEventListener('click', function () {
      index = (index + 1) % images.length;
      update();
    });

    update();
  })();
</script>
</body>
</html>
